name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: Package (unpacked .app)
    runs-on: macos-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build unpacked, ad-hoc signed .app
        run: npm run pack
      - name: Smoke test the packaged app (headless screenshot + node:sqlite)
        run: |
          MAILROOM_USER_DATA="$RUNNER_TEMP/mr-ci" MAILROOM_DEMO=1 MAILROOM_SIZE=1280x820 \
            MAILROOM_SHOT="$RUNNER_TEMP/shot.png" \
            "release/mac-arm64/Naushen Mail.app/Contents/MacOS/Naushen Mail"
          test -s "$RUNNER_TEMP/shot.png"
          test -s "$RUNNER_TEMP/mr-ci/mailroom.db"
      - uses: actions/upload-artifact@v7
        with:
          name: mailroom-smoke-screenshot
          path: ${{ runner.temp }}/shot.png

  package-cross:
    name: Package check (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win --x64 --dir
          - name: Linux
            os: ubuntu-latest
            args: --linux --x64 --dir
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate electron-builder config and package (unpacked)
        run: npx electron-builder ${{ matrix.args }}
